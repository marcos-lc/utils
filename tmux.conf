# Status Bar {{{
set-option -g status-left-length 3000
set-window-option -g status on
set-window-option -g status-justify right
set-window-option -g status-position top

set-window-option -g status-left '#{?client_prefix,#[reverse] MODO DE COMANDO Aguardando próxima tecla #[noreverse], #[reverse]    LEADCOMM   #[noreverse] }'
set-window-option -g status-right " #[fg=black,bg=#ffffff,bold] #S "
set-window-option -g status-style bg=default

set-window-option -g window-status-current-format '#I:#W#{?window_zoomed_flag, "ZOOOM"  ,}'
set-window-option -g window-status-current-style bg=#ff0201
# }}}

# Configuracao Default {{{
set-option -ag terminal-overrides ",xterm-256color:RGB"  # Correcao de Cor
set-option -g default-command "exec /bin/bash"           # Coloca o Shell Padrao para bash
set-option -g renumber-windows on                        # Renumera windows
set-option -g base-index 1                               # Começa index em 1
set-option -g pane-base-index 1                          # Comaça index em 1
set -g history-limit 500000                              # Colocar o maximo possivel no history
set-option -g mouse on                                   # Pode user o mouse, principalmente a questao de RESIZE
# }}}

# Comandos Customizados {{{

# Removendo Prefix + <Number> para mudar de janelas
  bind   a    command-prompt -p "Salvar historico" -I '/tmp/__leadcomm__tmuxHistory_-_%H_%M_%S' 'capture-pane -JS -; save-buffer %1 ; delete-buffer'
  bind   s    split-window -h -c '#{pane_current_path}'    # Split Vertical
  bind   -    split-window -v -c '#{pane_current_path}'    # Split Horizontal
  bind   r    source-file ~/.tmux.conf \; display "Reload" # Reload Arquivo
  bind   y    setw synchronize-panes # Habilita digitar a mesma coisa em todos os panes/splits

  bind   h    select-pane -L
  bind   j    select-pane -D
  bind   k    select-pane -U
  bind   l    select-pane -R
  bind   p    rotate-window  # Rotaciona painel ?

  # Trabalhando com sessões {{{
  bind   Tab  choose-tree -sZ     # Mostra sessoes criadas
  bind   n    command-prompt -p "Nome da nova Sessão: " "new-session -s '%%'"
  bind   $    command-prompt -I "#S" "rename-session '%%'"
  bind   g    switch-client -n
  # }}}

  # Copy mode com comando vim # {{{
  setw -g mode-keys vi
  bind-key -T copy-mode-vi v send-keys -X begin-selection
  bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle \; send -X begin-selection
  bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
  # }}}
# }}}
